# Publica a página do port (pasta site/) no GitHub Pages.
# Roda quando o site muda e à mão (Actions > Site > Run workflow): rode à mão depois
# de publicar uma release, para a página levar o criador novo. Sem gatilho de
# release: o ambiente github-pages só aceita o ramo main, e a página busca a versão
# mais nova sozinha.
name: Site
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false   # não corta uma publicação no meio
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar o site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site
          cp -r site/. _site/
          # O criador não fica no código (tem o ELF dentro): é tirado do ZIP da
          # release mais nova (mesmo pré-lançamento) a cada publicação.
          TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq ".[0].tagName")
          if [ -n "$TAG" ] && gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "RetroGames_Tekken_3_PS2_V*.zip" --dir /tmp/rel; then
            for z in /tmp/rel/*.zip; do
              case "$z" in *depuracao*) continue;; esac
              unzip -p "$z" Criar_Tekken3_PS2.html > _site/criador.html && break
            done
          fi
          [ -s _site/criador.html ] || { rm -f _site/criador.html; echo "::warning::o ZIP da release não tem o Criar_Tekken3_PS2.html"; }
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
